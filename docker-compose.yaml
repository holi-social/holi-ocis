# Based on https://github.com/owncloud/ocis/blob/master/deployments/examples/ocis_wopi/docker-compose.yml
---
version: "3.7"

services:
  traefik:
    image: traefik:v2.9.1
    container_name: traefik
    networks:
      ocis-net:
        aliases:
          - local.cloud.holi.social
          - local.wopiserver.holi.social
          - local.onlyoffice.holi.social
    command:
      - "--entryPoints.http.address=:80"
      - "--entryPoints.http.http.redirections.entryPoint.to=https"
      - "--entryPoints.http.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.https.address=:443"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedByDefault=false"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.http.routers.traefik.entrypoints=https"
      - "traefik.http.routers.traefik.rule=Host(`local.traefik.holi.social`)"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.routers.traefik.tls.certresolver=http"
      - "traefik.http.routers.traefik.service=api@internal"
    logging:
      driver: "local"
    restart: always

  ocis:
    image: owncloud/ocis:latest
    container_name: ocis
    networks:
      ocis-net:
    entrypoint:
      - /bin/sh
    command: ["-c", "ocis init || true; ocis server"]
    environment:
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_TLS: "false"
      WEB_OIDC_CLIENT_ID: b1c892b2-3746-4fca-a3f7-b3bafcffd9ee
      OCIS_OIDC_ISSUER: https://dev-auth.holi.social
      OCIS_URL: https://local.cloud.holi.social
      OCIS_LOG_LEVEL: debug
      OCIS_LOG_COLOR: "false"
      OCIS_INSECURE: "true"
      IDM_ADMIN_PASSWORD: "password"
      PROXY_ENABLE_BASIC_AUTH: "true"
      GATEWAY_GRPC_ADDR: 0.0.0.0:9142
    volumes:
      - ./config/ocis/app-registry.yaml:/etc/ocis/app-registry.yaml
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
    ports:
      - 9200:9200
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ocis.entrypoints=https"
      - "traefik.http.routers.ocis.rule=Host(`local.cloud.holi.social`)"
      - "traefik.http.routers.ocis.tls.certresolver=http"
      - "traefik.http.routers.ocis.service=ocis"
      - "traefik.http.services.ocis.loadbalancer.server.port=9200"
    logging:
      driver: "local"
    restart: always

  ocis-appprovider-onlyoffice:
    image: owncloud/ocis:latest
    container_name: ocis-appprovider-onlyoffice
    networks:
      ocis-net:
    user: "0"
    entrypoint:
      - /bin/sh
      - /entrypoint-override.sh
    environment:
      REVA_GATEWAY: ocis:9142
      APP_PROVIDER_GRPC_ADDR: 0.0.0.0:9164
      APP_PROVIDER_EXTERNAL_ADDR: ocis-appprovider-onlyoffice:9164
      APP_PROVIDER_DRIVER: wopi
      APP_PROVIDER_WOPI_APP_NAME: OnlyOffice
      APP_PROVIDER_WOPI_APP_ICON_URI: https://local.onlyoffice.holi.social/web-apps/apps/documenteditor/main/resources/img/favicon.ico
      APP_PROVIDER_WOPI_APP_URL: https://local.onlyoffice.holi.social
      APP_PROVIDER_WOPI_INSECURE: "true"
      APP_PROVIDER_WOPI_WOPI_SERVER_EXTERNAL_URL: https://local.wopiserver.holi.social
      APP_PROVIDER_WOPI_FOLDER_URL_BASE_URL: https://local.cloud.holi.social
    volumes:
      - ./config/ocis-appprovider-onlyoffice/entrypoint-override.sh:/entrypoint-override.sh
      - ocis-config:/etc/ocis
    logging:
      driver: "local"
    restart: always

  wopiserver:
    image: cs3org/wopiserver:latest
    container_name: wopiserver
    networks:
      ocis-net:
    entrypoint:
      - /bin/sh
      - /entrypoint-override.sh
    environment:
      WOPISERVER_INSECURE: "true"
      WOPISERVER_DOMAIN: local.wopiserver.holi.social
    volumes:
      - ./config/wopiserver/entrypoint-override.sh:/entrypoint-override.sh
      - ./config/wopiserver/wopiserver.conf.dist:/etc/wopi/wopiserver.conf.dist
      - wopi-recovery:/var/spool/wopirecovery
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wopiserver.entrypoints=https"
      - "traefik.http.routers.wopiserver.rule=Host(`local.wopiserver.holi.social`)"
      - "traefik.http.routers.wopiserver.tls.certresolver=http"
      - "traefik.http.routers.wopiserver.service=wopiserver"
      - "traefik.http.services.wopiserver.loadbalancer.server.port=8880"
    logging:
      driver: "local"
    restart: always
    ports:
      - 8880:8880
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice
    networks:
      ocis-net:
    entrypoint:
      - /bin/sh
      - /entrypoint-override.sh
    environment:
      WOPI_ENABLED: "true"
      USE_UNAUTHORIZED_STORAGE: "true"
    volumes:
      - ./config/onlyoffice/entrypoint-override.sh:/entrypoint-override.sh
      - ./config/onlyoffice/local.json:/etc/onlyoffice/documentserver/local.dist.json
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.onlyoffice.entrypoints=https"
      - "traefik.http.routers.onlyoffice.rule=Host(`local.onlyoffice.holi.social`)"
      - "traefik.http.routers.onlyoffice.tls.certresolver=http"
      - "traefik.http.routers.onlyoffice.service=onlyoffice"
      - "traefik.http.services.onlyoffice.loadbalancer.server.port=80"
      - "traefik.http.middlewares.onlyoffice.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.onlyoffice.middlewares=onlyoffice"
    logging:
      driver: "local"
    restart: always
    ports:
      - 9201:80

volumes:
  ocis-config:
  ocis-data:
  wopi-recovery:

networks:
  ocis-net:
