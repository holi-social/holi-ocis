stages:
  - "deploy"

default:
  before_script:
    - set -eu
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  interruptible: true
  tags:
    - 1cpu-4gb # build on smaller machine

deploy:
  stage: "deploy"
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.11.2'
    # default entrypoint is terraform command, but we want to run shell scripts
    entrypoint: ["/bin/sh", "-c"]
  script:
    - cd terraform/common/
    - terraform init
    - terraform apply -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success


